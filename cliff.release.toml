# git-cliff template for GitHub release notes (no version header).
# Used by publish.yml to generate RELEASE_NOTES.md for the tag being released.
# For the full CHANGELOG (with version headers), see cliff.toml.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | split(pat="\n") | first }} \
([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/lguerard/vscode-one-monokai/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}\
{% if github.contributors | length > 0 %}
### 👥 Contributors

{% for contributor in github.contributors | sort(attribute="username") %}\
- [@{{ contributor.username }}](https://github.com/{{ contributor.username }})
{% endfor %}
{% endif %}\
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  { pattern = "(\\w+(?:\\([^)]*\\))?!?:\\s+)[^\\w\\s]+\\s*", replace = "$1" },
]
commit_parsers = [
  { message = "^[Mm]erge", skip = true },
  { message = "^feat", group = "✨ Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "♻️ Refactoring" },
  { message = "^docs", group = "📝 Documentation" },
  { message = "^style", skip = true },
  { message = "^test", group = "✅ Tests" },
  { message = "^ci", group = "👷 CI/CD" },
  { message = "^build", group = "🏗️ Build" },
  { message = "^revert", group = "⏪ Reverts" },
  { message = "^chore\\(version\\)|^chore: bump version", skip = true },
  { message = "^chore", group = "🔧 Chores" },
  { message = "^wip", skip = true },
  { message = ".*", group = "🔧 Miscellaneous" },
]
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"

[remote.github]
owner = "lguerard"
repo = "vscode-one-monokai"
