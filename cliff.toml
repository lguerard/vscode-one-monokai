# git-cliff configuration — generates the full CHANGELOG from conventional commits.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to the "One Monokai" VS Code theme are documented here.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | split(pat="\n") | first }} \
([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/lguerard/vscode-one-monokai/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}\
{% if github.contributors | length > 0 %}
### 👥 Contributors

{% for contributor in github.contributors | sort(attribute="username") %}\
- [@{{ contributor.username }}](https://github.com/{{ contributor.username }})
{% endfor %}
{% endif %}\
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Strip leading emoji from the description (after "type(scope): ")
commit_preprocessors = [
  { pattern = "(\\w+(?:\\([^)]*\\))?!?:\\s+)[^\\w\\s]+\\s*", replace = "$1" },
]
commit_parsers = [
  { message = "^[Mm]erge", skip = true },
  { message = "^feat", group = "✨ Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "♻️ Refactoring" },
  { message = "^docs", group = "📝 Documentation" },
  { message = "^style", skip = true },
  { message = "^test", group = "✅ Tests" },
  { message = "^ci", group = "👷 CI/CD" },
  { message = "^build", group = "🏗️ Build" },
  { message = "^revert", group = "⏪ Reverts" },
  { message = "^chore\\(version\\)|^chore: bump version", skip = true },
  { message = "^chore", group = "🔧 Chores" },
  { message = "^wip", skip = true },
  { message = ".*", group = "🔧 Miscellaneous" },
]
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"

# GitHub integration: lists contributors (github.contributors) in release notes.
# Requires GITHUB_TOKEN at runtime (provided by GHA).
[remote.github]
owner = "lguerard"
repo = "vscode-one-monokai"
